name: Release

# A push to main whose manifest version has no tag yet is a release: tag it, publish it with that version's
# CHANGELOG section as notes, and attach the plugin files. Pushes that don't bump the version do nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Signed build provenance for the release files (verify with `gh attestation verify`).
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version to release
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "Tag $version already exists: nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes from the CHANGELOG
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no \"## $VERSION\" section" >&2
            exit 1
          fi
          cat notes.md
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.release == 'true'
        with:
          node-version: lts/*
          cache: npm
      - if: steps.version.outputs.release == 'true'
        run: npm ci
      - if: steps.version.outputs.release == 'true'
        run: npm run lint
      - if: steps.version.outputs.release == 'true'
        run: npm test
      - if: steps.version.outputs.release == 'true'
        run: npm run build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.release == 'true'
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish the release with the plugin files
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" main.js manifest.json styles.css --title "$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
