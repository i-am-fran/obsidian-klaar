remote_theme: i-am-fran/web-docs-template
plugins:
  - jekyll-remote-theme

collections:
  docs:
    output: false

title: "Klaar"
tagline: "A small task manager for Obsidian. Write tasks as normal checkboxes in any note, give them a day, week, month or year, and they show up in your journal notes."
description: "Klaar is a small task manager for Obsidian: write plain Markdown checkboxes in any note, schedule them with > and see them in their day, week, month, quarter and year notes."
github_url: "https://github.com/i-am-fran/obsidian-klaar"
author_url: "https://iamfran.com"
author_label: "iamfran.com"
repository: "i-am-fran/obsidian-klaar"
url: "https://i-am-fran.github.io"
baseurl: "/obsidian-klaar"
logo: "/assets/klaar-logo.png"

# GitHub Pages turns on the Primer theme by default, whose style.scss can
# overwrite the template's assets/css/style.css. Turn it off.
theme: null

markdown: kramdown
kramdown:
  auto_ids: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - superpowers
