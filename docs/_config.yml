remote_theme: i-am-fran/web-docs-template
plugins:
  - jekyll-remote-theme

collections:
  docs:
    output: false

title: "Klaar"
tagline: "A small task manager that lives in your Obsidian journal notes. Write tasks as normal checkboxes and assign them to a day, a week, a month or a year."
description: "Klaar is a small task manager for Obsidian journal notes: schedule plain Markdown checkboxes with > and see them in their day, week, month, quarter and year notes."
github_url: "https://github.com/i-am-fran/obsidian-klaar"
author_url: "https://iamfran.com"
author_label: "iamfran.com"
repository: "i-am-fran/obsidian-klaar"
url: "https://i-am-fran.github.io"
baseurl: "/obsidian-klaar"

markdown: kramdown
kramdown:
  auto_ids: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - superpowers
